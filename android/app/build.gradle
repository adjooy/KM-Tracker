plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.panel'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.panel"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
